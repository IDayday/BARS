dataset_name: scene-play-v0
dataset_dir: /mnt/project/offlinerl_datasets/ogbench
max_transitions: 200000
phase2_run: core_plus_bottleneck_budget192_H25
base_phase2_run_dir: results/phase2/scene_play/core_plus_bottleneck_budget192_H25
repair_bank_phase2_run_dir: results/phase2/scene_play/all_budget192_H25
phase4e_run_dir: results/phase4e/scene_play/core_plus_bottleneck_budget192_H25__repair_all_budget192_H25
path_metrics_csv: results/phase4e/scene_play/core_plus_bottleneck_budget192_H25__repair_all_budget192_H25/repair_planning_paths.csv
run_name: core_plus_bottleneck_budget192_H25_3000
output_dir: results/phase4m_training
summary_output_dir: results/phase4m
baseline_method: augmented_loss_support_bottleneck_s03
planner_method: compat_threshold
graph_variant: repaired
experiments:
  - method: augmented_loss_support_bottleneck_s03
    sampling_mode: uniform_transition
    loss_weight_mode: support_bottleneck
    loss_weight_strength: 0.3
    loss_weight_min: 0.7
    loss_weight_max: 1.8
  - method: planner_relevant_repair_s04
    sampling_mode: uniform_transition
    loss_weight_mode: planner_relevant
    base_loss_weight_mode: support_bottleneck
    base_loss_weight_strength: 0.3
    base_loss_weight_min: 0.7
    base_loss_weight_max: 1.8
    planner_relevance_strength: 0.4
    hard_repair_strength: 0.2
    repair_only_planner_relevance: true
    loss_weight_min: 0.7
    loss_weight_max: 2.2
  - method: planner_relevant_repair_s02
    sampling_mode: uniform_transition
    loss_weight_mode: planner_relevant
    base_loss_weight_mode: support_bottleneck
    base_loss_weight_strength: 0.3
    base_loss_weight_min: 0.7
    base_loss_weight_max: 1.8
    planner_relevance_strength: 0.2
    hard_repair_strength: 0.1
    repair_only_planner_relevance: true
    loss_weight_min: 0.75
    loss_weight_max: 1.9
seeds: [0, 1]
num_steps: 3000
batch_size: 1024
lr: 3e-4
hidden_dims: [512, 512, 512]
val_fraction: 0.05
val_examples: 8192
log_interval: 1000
device: cuda
edge_embedding_dim: 0
direct_batch_size: 2048
direct_max_examples: 50000
direct_temperature: 0.05
cuda_visible_devices: "7"
